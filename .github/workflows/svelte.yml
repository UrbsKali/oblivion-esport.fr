on:
  push:
    branches:
    - dev-svelte
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    name: 🤖 Compile Svelte v2 version
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    - name: 🍰 Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # The version of Bun to install. (e.g. "latest", "canary", "1.0.0", "1.0.x", <sha>)
        bun-version: 'latest'
    - name: ⚙️ Compile project
      run: |
          bun install
          bun run build          
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftp.cluster029.hosting.ovh.net
        username: oblivig
        password: ${{ secrets.ftp_password }}
        local-dir: './build/'
        server-dir: '/www/v2/'
    
    
    
